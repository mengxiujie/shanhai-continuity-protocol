<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>未叙山海｜四幕连续性演示</title>
<link rel="stylesheet" href="styles.css">
<main class="shell">
  <p class="eyebrow">WEIXU / SHANHAI CONTINUITY</p>
  <h1>你的山海记得你</h1>
  <p class="muted">Owner 端选择、加密并授权；Agent B 端只在 Monad 门禁通过后接续。当前链状态为本地 Demo Provider，尚未连接真实 Monad 合约。</p>
  <div class="steps"><span class="step active" data-act="1">01 创建</span><span class="step" data-act="2">02 接续</span><span class="step" data-act="3">03 改变</span><span class="step" data-act="4">04 撤销</span></div>
  <section class="grid"><div class="card"><h2>Owner Web</h2><label>合成材料（仅用于演示）</label><textarea id="statement">我希望别人记住我愿意把复杂问题讲清楚。</textarea><p><button class="button" id="create">创建 V1 并授权</button> <button class="button alt" id="change">创建 V2 / 重放 V1</button> <button class="button alt" id="revoke">撤销授权</button></p><pre id="envelope" class="muted">尚未生成 envelope</pre></div><div class="card"><h2>Agent B</h2><p class="tag">独立接续端</p><p><button class="button" id="continue">请求接续</button> <button class="button alt" id="reset">重置演示</button></p><div id="status" class="status">等待 Owner 操作。</div><h3>本地上下文</h3><pre id="context" class="muted">没有任何上下文进入模型。</pre></div></section>
</main><script type="module" src="app.js"></script>
