<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monad Live Receipt Probe</title><link rel="stylesheet" href="styles.css">
<main class="shell"><p class="eyebrow">MONAD TESTNET / READ ONLY</p><h1>真实授权门禁探针</h1><p class="muted">只读取 Monad 测试网，不发交易、不请求私钥。请在合约部署后填入真实地址与 bytes32 标识。</p>
<section class="card"><label>Registry address</label><textarea id="registry" style="min-height:48px"></textarea><label>Asset ID (bytes32)</label><textarea id="asset" style="min-height:48px"></textarea><label>Consent ID (bytes32)</label><textarea id="consent" style="min-height:48px"></textarea><label>Grantee address</label><textarea id="grantee" style="min-height:48px"></textarea><label>Scope hash (bytes32)</label><textarea id="scope" style="min-height:48px"></textarea><label>Version</label><input id="version" value="1"><p><button id="read" class="button">读取真实 Receipt</button></p><pre id="result" class="status">等待输入。</pre></section></main>
<script type="module">
import { MonadConsentRegistryAdapter } from './monad-gate.js'; import { MonadJsonRpcClient, MonadConsentRegistryRpcProvider } from './monad-rpc-provider.js';
const $=(id)=>document.getElementById(id); $('read').onclick=async()=>{try{const registryAddress=$('registry').value.trim();const rpc=new MonadJsonRpcClient({rpcUrl:'https://testnet-rpc.monad.xyz'});const provider=new MonadConsentRegistryRpcProvider({rpc,registryAddress,selectors:{getAsset:'0x2cc3ce80',getConsent:'0x7715ae34'}});const gate=new MonadConsentRegistryAdapter({chainId:10143,registryAddress,provider});const receipt=await gate.verify({assetId:$('asset').value.trim(),consentId:$('consent').value.trim(),grantee:$('grantee').value.trim().toLowerCase(),version:Number($('version').value),scopeHash:$('scope').value.trim(),now:Math.floor(Date.now()/1000)});$('result').textContent=JSON.stringify(receipt,null,2)}catch(error){$('result').textContent=JSON.stringify({status:'FAIL_CLOSED',code:error.code||error.message},null,2)}};
</script>
