name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
      - run: npm ci
      - run: npm ci --prefix contracts
      - run: npm test
      - run: npm run test:process
      - run: npm run compile:contract
